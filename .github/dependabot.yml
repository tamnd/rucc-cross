# There is no dependency file in this repository and there is not meant to be one. Everything the
# corpus needs is either in the pinned manifest, which moves by hand through
# `toolchains/record-hash`, or comes from the platform's package manager.
#
# So the only thing here is the actions, which are pinned to a patch version on purpose and
# therefore need something to move them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
