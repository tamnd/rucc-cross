# Tagged releases: check the tag, build the tool on every host, publish the archives to GitHub
# and publish the source to crates.io.
#
# crates.io comes last on purpose. A version there cannot be taken back, only yanked, so nothing
# is uploaded until the tag has passed the gate and built everywhere.
#
# The version scheme is the one the milestone plan implies. A patch release is cut when enough
# has landed to be worth a tag, and a minor release is cut when a milestone in spec/15-plan.md is
# finished. Neither is automatic, because deciding a milestone is done is a judgement and the
# changelog entry is where it gets written down.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build, for a dry run
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that does not pass the gate does not become a release. Cheaper to find out here than
  # after the artifacts are uploaded.
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: the version in the tag matches the workspace
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "tag $tag says $want but Cargo.toml says $have"
            exit 1
          fi
          echo "releasing $have"
      - name: the changelog has an entry
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          grep -q "## ${tag#v}" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${tag#v}"
            exit 1
          }
      - name: the house rules still pass
        run: |
          cargo fmt --all --check
          cargo xtask style
          cargo xtask targets --check
          cargo clippy --workspace --all-targets --all-features
          cargo test --workspace --all-features

  build:
    name: build for ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --bin rucc-cross --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="rucc-cross-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rucc-cross.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/rucc-cross" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cd dist
          # Both formats, because the people who want a .zip and the people who want a .tar.gz
          # do not overlap and neither group should have to install a tool.
          tar --format=ustar -czf "$name.tar.gz" "$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            zip -qr "$name.zip" "$name"
          fi
          for f in "$name.tar.gz" "$name.zip"; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance attestation, so that someone downloading a binary can check which workflow
      # run and which commit produced it. spec/13-distribution.md asks for the same property of
      # everything this repository will one day ship, and starting with the tool itself means
      # the mechanism is in place before there is anything large to attach it to.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: list what is being published
        run: ls -l dist
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The release notes are the changelog section, written by hand, rather than a list of
      # commit subjects. GitHub's generated list of merged pull requests is appended after it
      # for anyone who wants the detail.
      - name: take the release notes from the changelog
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          awk -v want="## ${tag#v}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $tag"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          # Nothing here is stable and the target list is still moving, so every release before
          # 1.0 says so rather than letting a version number imply a promise.
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') && !startsWith(github.ref_name, 'v2.') }}
          fail_on_unmatched_files: true

  # The crates go to crates.io in dependency order, which cargo works out from the workspace
  # graph. They are versioned and released together, so a partial upload is a bug rather than a
  # supported state, and `--locked` means the published tree resolves to exactly what CI tested
  # rather than to whatever was newest that morning.
  #
  # This does not run for a workflow_dispatch dry run. A dry run is for checking that the
  # binaries build, and an upload to crates.io cannot be undone.
  crates-io:
    name: publish to crates.io
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/publish-crates.sh
