# The slow half, and the half that watches the outside world.
#
# Two kinds of job. The first compares the reference against itself over time: a new zig or a new
# gcc changes what the facts files say, and finding that out the morning after the release is much
# cheaper than finding it out inside a pull request that was about something else. The second is
# the wide execution matrix, which is too slow for the gate.

name: nightly

on:
  schedule:
    # After the compiler repository's nightly, so a shared failure is easy to order.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What the reference says today, against what it said when the facts were recorded, with the
  # pinned version replaced by whatever is current. A difference here is a heads up about the next
  # version bump rather than a failure, so it does not fail the run.
  drift:
    name: what a newer zig would say
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install the newest zig
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://ziglang.org/download/index.json | grep -o '"[0-9]\+\.[0-9]\+\.[0-9]\+"' | head -1 | tr -d '"')
          pinned=$(awk -F'\t' '$1 == "zig" { print $2; exit }' toolchains/manifest)
          echo "pinned $pinned, newest $version"
          if [ "$version" = "$pinned" ]; then
            echo "the pin is current"
            exit 0
          fi
          echo "the pin is behind, and toolchains/record-hash is how it moves"
          exit 1

  # The executing corpus on both host architectures, so that a result that depends on the machine
  # that built the binary rather than on the machine that ran it has somewhere to show up.
  execute:
    name: run the corpus on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install zig and qemu
        run: |
          ./toolchains/install zig
          ./toolchains/install qemu
      - name: build and run
        run: ./bin/run-corpus

  # The same corpus against the platform's cross gcc rather than against zig, for the rows where a
  # gcc exists. When the two references disagree, that is the interesting day, and the whole reason
  # for having two.
  #
  # Three installs rather than one, because the targets table names a gcc for thirteen rows and
  # gcc-cross holds seven of them. Without the other two buckets the job printed twelve `is not on
  # the path` failures a night for six targets nobody was checking, which is the shape of noise that
  # hides the one real disagreement this job exists to find. x86-64 only, which is why the two extra
  # buckets can be the ones Ubuntu packages for an amd64 host.
  second-opinion:
    name: the corpus against cross gcc
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: install the cross compilers and qemu
        run: |
          ./toolchains/install gcc-cross
          ./toolchains/install gcc-cross-x86
          ./toolchains/install gcc-cross-corpus
          ./toolchains/install qemu
      - name: record which gcc this was
        run: aarch64-linux-gnu-gcc --version | head -1
      - name: the layout corpus
        env:
          RUCC_CROSS_REFERENCE: gcc
        run: ./bin/compile-corpus
      # The compiler's generated corpus against the other reference. The gate compiles it against
      # zig, which is clang, so this is the run that would catch rucc having been made to agree with
      # clang about something gcc does differently. Section 6.9 of the compiler's cross specification
      # says which side wins when they disagree, and this is what asks the question.
      - name: the compiler's layout corpus
        env:
          RUCC_CROSS_REFERENCE: gcc
        run: ./bin/compile-abi-corpus rucc/tests/abi-corpus
      - name: the compiler's signature corpus
        env:
          RUCC_CROSS_REFERENCE: gcc
        run: ./bin/compile-abi-signatures rucc/tests/abi-signatures
      - name: the executing corpus
        env:
          RUCC_CROSS_REFERENCE: gcc
        run: ./bin/run-corpus

  # The kernel header tree, produced on both host architectures, and the two records held against
  # each other. That comparison is the reproducibility criterion of tamnd/rucc#619 applied to this
  # half of a sysroot, and it is the whole reason the job runs twice: the tree is the same text for
  # every target, so the host it was produced on must not be able to show up in it.
  #
  # It is here rather than in the gate because seven `make headers_install` runs take about four and a
  # half minutes on a runner, and nothing in this repository changes the result except the pinned
  # source. Nothing is cached either, for the same reason: a cache hit would skip the work and then
  # compare two copies of a file that came from the same run.
  kernel-headers:
    name: the kernel headers on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      # Copied into the workspace rather than uploaded from the cache, because the path input of
      # upload-artifact is a glob and not a shell, so a tilde in it is a directory named tilde.
      - name: produce the tree
        run: |
          ./bin/kernel-headers
          cp "$HOME/.cache/rucc-cross/kernel-headers/manifest" manifest
      - name: upload the record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-headers-${{ runner.arch }}
          path: manifest

  kernel-headers-reproducible:
    name: the same kernel headers on two hosts
    needs: kernel-headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: download both records
        uses: actions/download-artifact@v8.0.1
        with:
          path: records
      - name: they have to be the same file
        run: ./bin/kernel-headers --check records/kernel-headers-X64/manifest records/kernel-headers-ARM64/manifest

  # glibc's headers for all nine glibc ABIs, produced on both host architectures, and the two records
  # held against each other. Same criterion as the kernel header job above and the same reason for
  # running it twice, with one extra thing to catch: this one runs a configure script nine times, and a
  # configure script is the classic way for a fact about the build machine to end up in the output.
  #
  # It needs the kernel headers first, because glibc's configure reads them, so the job produces both
  # trees. That is about six minutes for the pair on a runner, which is why this is nightly and not in
  # the gate.
  #
  # The glibc install is also the only thing here that wants gawk. The runner images have it, and the
  # script says so plainly if a machine does not.
  #
  # The compiler for the configure runs is the pinned zig, the same one bin/sysroot uses, so it has to
  # be installed first. It is not the distribution's cross gcc and this job does not want one.
  glibc-headers:
    name: glibc's headers on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install zig
        run: ./toolchains/install zig
      - name: produce the trees
        run: |
          ./bin/kernel-headers
          cp "$(./bin/glibc-headers)" manifest
      - name: upload the record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: glibc-headers-${{ runner.arch }}
          path: manifest

  glibc-headers-reproducible:
    name: the same glibc headers on two hosts
    needs: glibc-headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: download both records
        uses: actions/download-artifact@v8.0.1
        with:
          path: records
      - name: they have to be the same file
        run: ./bin/glibc-headers --check records/glibc-headers-X64/manifest records/glibc-headers-ARM64/manifest

  # glibc's start files and libc_nonshared.a for all nine glibc ABIs, produced on both host
  # architectures, and the two records held against each other. The third reproducibility job, and the
  # first one whose output is compiled code rather than text: these are the objects every Linux link
  # line begins with, so a difference between two hosts here is a difference in the program somebody
  # gets.
  #
  # It also links and runs. Each ABI's files are linked five ways by the distribution's cross gcc and
  # the result is executed, on hardware for the host's own row and under qemu for the others, so the
  # job proves the objects work and not only that they hash the same. Two of the five link the archive,
  # and one of those runs under -pg and has to leave a gmon.out behind, which is the profiler saying it
  # found atexit where our archive put it. The cross compilers are therefore not optional here the way
  # they are in the gate, and the x86 pair is x86-64 only because Ubuntu packages those two for an
  # amd64 host. x32 is compiled and linked and never run, and the header of the targets table says why.
  #
  # Nine configures, nine builds of glibc's csu directory and nine sweeps for the archive's members are
  # about four minutes, on top of the kernel headers this needs first, which is the same reason the two
  # jobs above are nightly.
  glibc-startfiles:
    name: glibc's start files on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install zig, the cross compilers and qemu
        run: |
          ./toolchains/install zig
          ./toolchains/install gcc-cross
          ./toolchains/install qemu
      - name: install the other two x86 trees
        if: runner.arch == 'X64'
        run: ./toolchains/install gcc-cross-x86
      - name: produce the start files
        run: |
          ./bin/kernel-headers
          ./bin/glibc-startfiles
          cp "$HOME/.cache/rucc-cross/glibc-startfiles/manifest" manifest
      - name: upload the record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: glibc-startfiles-${{ runner.arch }}
          path: manifest

  glibc-startfiles-reproducible:
    name: the same glibc start files on two hosts
    needs: glibc-startfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: download both records
        uses: actions/download-artifact@v8.0.1
        with:
          path: records
      - name: they have to be the same file
        run: ./bin/glibc-startfiles --check records/glibc-startfiles-X64/manifest records/glibc-startfiles-ARM64/manifest

  # Upstream glibc's headers against the distribution's own, at the version the runner ships. The two
  # jobs above ask whether our tree is reproducible and whether it reassembles, which are both
  # questions about our own output. This one is the only job that asks whether the text is right, by
  # holding every installed file against the copy a real distribution built from the same release.
  #
  # Both host architectures for the same reason real-libc runs twice: there is one distribution per
  # machine, and the x86-64 runner compares eight ABIs where the arm64 one compares six. The x86 step
  # is what makes that eight, and it only runs on the x86-64 runner because Ubuntu packages those two
  # cross toolchains for an amd64 host only.
  #
  # A file that differs and has no line in sysroots/distribution-patches fails the run, and the fix is
  # usually to read the distribution's patch and add the line. That is rare enough to be worth a red
  # morning: a distribution does not change a header in a stable release very often, and when it does,
  # that is a fact about what people's machines actually contain.
  glibc-distribution:
    name: upstream glibc against ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: record which distribution this is
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME with $(ldd --version | head -1)"
      - name: install the cross compilers
        run: ./toolchains/install gcc-cross
      - name: install the other two x86 trees
        if: runner.arch == 'X64'
        run: ./toolchains/install gcc-cross-x86
      # zig is the fallback compiler for a row the distribution's gcc cannot configure, which on Ubuntu
      # 24.04 is i386, and the script says which compiler each row used.
      - name: install zig
        run: ./toolchains/install zig
      - name: compare against the distribution
        run: |
          ./bin/kernel-headers
          ./bin/glibc-distribution

  # What the releases in the support table differ by, held against the committed record. This is the
  # measurement the multi-version tree was waiting on and the job below is that tree, and the two are
  # separate because this one is a number a reviewer reads and that one is an artifact. The thing
  # that can go wrong here is that somebody changes how a release is installed or adds a release to
  # sysroots/manifest and the record stops describing what comes out. Either is a real answer and
  # neither is noise, which is why this fails the run like the others.
  #
  # One architecture, unlike the job above, because the survey installs one ABI and it would be the
  # same record from either runner. The eight installs are about two minutes between them.
  glibc-versions:
    name: what the glibc releases differ by
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install the cross compilers
        run: ./toolchains/install gcc-cross
      - name: install zig
        run: ./toolchains/install zig
      - name: hold the record against what this machine produces
        run: |
          ./bin/kernel-headers
          ./bin/glibc-versions

  # The eight releases merged into the one tree section 8.3 of the sysroot specification asks for,
  # produced on both host architectures, and the two records held against each other. This is the
  # whole tree rather than a sample of it: every release, split into the generic directory and the
  # seven family directories the compiler searches, with the patched features.h and the synthesized
  # gnu/stubs.h in it, because bin/glibc-headers --release leaves exactly that behind and this merges
  # what it left.
  #
  # Which is why this job installs rather than reading someone else's installs. It is nine ABIs of
  # eight releases, sixty eight of the seventy two, since glibc learned loongarch64 in 2.36 and the
  # four releases older than that have no sysdeps directory for it. That is forty five minutes on an
  # eight core machine running three installs at a time, and a four core runner will not beat it, so
  # this is nightly for the reason the rest of this half of the file is.
  #
  # Both architectures, and what the second one is for is the bytes rather than the compiler. Every
  # install is the pinned zig on either host, so an x86-64 runner and an arm64 runner doing the same
  # work have to leave the same tree behind, and the two manifests are how that is asked.
  #
  # The compiler is checked out because the merge is a program in its build-tools, and it is a
  # program rather than a script because reading every release back out of a merged file to check
  # that the merge was right is not shell work.
  glibc-merged:
    name: the merged glibc tree on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: install zig
        run: ./toolchains/install zig
      - name: produce the tree
        env:
          RUCC_SRC: rucc
        run: |
          ./bin/kernel-headers
          for release in $(awk -F'\t' '$1 == "glibc" { print $2 }' sysroots/manifest); do
            ./bin/glibc-headers --release "$release"
          done
          cp "$(./bin/glibc-merged)" manifest
      - name: upload the record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: glibc-merged-${{ runner.arch }}
          path: manifest

  glibc-merged-reproducible:
    name: the same merged glibc tree on two hosts
    needs: glibc-merged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: download both records
        uses: actions/download-artifact@v8.0.1
        with:
          path: records
      - name: they have to be the same file
        run: ./bin/glibc-merged --check records/glibc-merged-X64/manifest records/glibc-merged-ARM64/manifest

  # The merged tree built against, and then run on, the libc each release actually shipped in. This is
  # the third of the three checks section 8.4 of the sysroot specification asks for, and the only one
  # of them that can find the thing section 8.3 is most afraid of. The two checks above it hold our
  # header text against somebody else's header text, and a header that describes a structure the
  # library stopped using is correct text in both trees. What is wrong is the pair of the header and
  # the machine, and the only way to ask about a pair is to run it.
  #
  # stat is the example the specification names. Until 2.33 the header turned the call into __xstat
  # with a leading version argument and from 2.33 there is a real stat symbol, so a binary built with
  # the newer spelling and run on 2.28 names something that release does not export and the loader
  # refuses to start it. That is not a hypothetical: the same program compiled for 2.39 and run on
  # debian:10 fails with GLIBC_2.33 not found, and compiled for 2.28 out of the same merged tree it
  # runs.
  #
  # Seven releases, because 2.44 is the pin and the newest libc any distribution ships today is 2.43,
  # and both architectures, because the tree's split is per machine and a check that only ever reads
  # one family directory says nothing about the other six. That is fourteen pairs of ten programs in
  # three ways plus the sqlite shell, which is rung 0 and rung 1 of the target ladder and is what
  # section 8.4 asks for. The aarch64 half of it is binfmt rather than a machine, which is the
  # distinction section 14.5 makes and not this job's to blur.
  #
  # The tree is produced here rather than taken off the job above, the same way six jobs in this file
  # run bin/kernel-headers for themselves rather than sharing one install. That is most of an hour
  # before this job starts doing its own work, and the work itself is about fifty minutes on an eight
  # core machine, so this is the longest job in the file by some way. A nightly is where that goes.
  glibc-image-check:
    name: the merged glibc tree on real distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: install zig
        run: ./toolchains/install zig
      # binfmt, so that the aarch64 half of the grid has something to run on. A tag rather than a
      # digest for the reason sysroots/images gives about its own images, and tonistiigi/binfmt
      # directly rather than the action that wraps it, because the action is one docker run and this
      # file has nothing but actions/* in it.
      - name: let this host run the other architecture
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: produce the tree
        env:
          RUCC_SRC: rucc
        run: |
          ./bin/kernel-headers
          for release in $(awk -F'\t' '$1 == "glibc" { print $2 }' sysroots/manifest); do
            ./bin/glibc-headers --release "$release"
          done
          ./bin/glibc-merged >/dev/null
      - name: build the corpus against ours and run it on theirs
        run: ./bin/glibc-image-check

  # The three windows-gnu sysroots, produced from source and held against the hashes the compiler's
  # release pins for them. Every other reproducibility job here compares two fresh runs against each
  # other, and this one compares a fresh run against a fixed published number, which is the stronger
  # question: two runs can agree on the wrong thing, and neither of them can drift away from the
  # bytes people are actually downloading without this noticing. It is the half of document 13
  # section 13.6 that was waiting on there being a published tree to check, and there is one now.
  #
  # Both host architectures, because that is also the two host comparison for free. If an x86-64
  # runner and an arm64 runner both reproduce the same published hash then they reproduce each other,
  # and there is nothing to upload and nothing to compare afterwards.
  #
  # The compiler is checked out for one committed file. PROVENANCE is the release's own list of what
  # it pins, generated from the table in crates/rucc-sysroot/src/artifact.rs, so reading it is reading
  # the pin rather than a copy of it that could fall behind.
  #
  # Three headers installs and three crt builds are about nine minutes on a four core runner, which
  # is why this is nightly rather than in the gate, and nothing is cached for the same reason the
  # kernel header job caches nothing: a cache hit would skip the work and then compare a file against
  # the hash of the run that produced it.
  mingw-sysroots:
    name: the mingw-w64 sysroots on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: install zig
        run: ./toolchains/install zig
      - name: produce the three sysroots
        run: |
          set -eu
          for target in x86_64-windows-gnu i686-windows-gnu aarch64-windows-gnu; do
            ./bin/mingw-headers "$target"
            ./bin/mingw-runtime "$target"
          done
      - name: pack them
        run: ./bin/artifact x86_64-windows-gnu i686-windows-gnu aarch64-windows-gnu
      - name: hold them against what the compiler pins
        run: |
          ./bin/artifact --against rucc/PROVENANCE \
            x86_64-windows-gnu i686-windows-gnu aarch64-windows-gnu

  # The compiler's glibc stubs against the real glibc on the runner, which is the comparison
  # spec/cross-compile/09-libc-stubs.md section 9.8 calls the highest value test in that document. The
  # description comes from bin/abilist, which fetches a pinned glibc source and takes the abilist out
  # of it, and the comparison itself is a task in the compiler, because that is where the code that
  # writes a stub is.
  #
  # It is here rather than in the gate for the reason the gate's own header gives: that job list is
  # about the pinned reference toolchain and builds nothing of the compiler. This one builds two of
  # its crates, so a morning when the compiler's main branch does not build is a morning this is red
  # and the gate is not.
  #
  # Both host architectures, because there is one real libc per machine and the whole point is to
  # compare against a real one. That makes this two architectures of coverage, which is two more than
  # any amount of reading our own output gives.
  real-libc:
    name: the compiler's glibc stub against ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
            arch: x86_64
          - name: linux aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: record which glibc this is
        run: ldd --version | head -1
      - name: fetch glibc's own description of it
        run: ./bin/abilist ${{ matrix.arch }}
      # The default cache directory, spelled the way every other job here spells it, rather than a
      # path this job sets for itself. Where the abilists went is bin/abilist's decision and the
      # compiler only needs telling once.
      - name: hold our stub against the real library
        working-directory: rucc
        run: RUCC_ABILISTS="$HOME/.cache/rucc-cross/abilists" cargo xtask real-libc

  report:
    name: nightly
    if: always()
    needs:
      - drift
      - execute
      - second-opinion
      - real-libc
      - kernel-headers
      - kernel-headers-reproducible
      - glibc-headers
      - glibc-headers-reproducible
      - glibc-startfiles
      - glibc-startfiles-reproducible
      - glibc-distribution
      - glibc-versions
      - glibc-merged
      - glibc-merged-reproducible
      - glibc-image-check
      - mingw-sysroots
    runs-on: ubuntu-24.04
    steps:
      # `drift` and `second-opinion` are allowed to fail without failing the run. A new zig release
      # is not a bug and a gcc that disagrees with clang is a question rather than a regression, and
      # a red mark every morning for either is a red mark people stop reading. The other three are
      # ours: a symbol we promise that glibc does not have is a bug in the compiler or in the pin, and
      # a header tree that came out different on two hosts is a bug in how it is produced. Either one
      # is somebody here fixing something, and the two header trees count the same way. So do the
      # start files, twice over: an object that came out different on two hosts is the same bug as a
      # header that did, and one that does not link or does not run is a worse one. So does the
      # comparison against the distribution: a header that is not the distribution's text is either a
      # patch nobody has written down yet or a recipe that stopped producing what it claims to. The
      # survey of what the releases differ by counts the same way, because a record that has stopped
      # describing what comes out is a record nobody should be reading, and the tree merged out of those
      # releases counts twice, once for the merge refusing its own output and once for the two hosts
      # disagreeing about the bytes. Running that tree on the distributions counts hardest of the
      # header jobs, because it is the only one whose failure is a binary that does not start on
      # somebody's machine rather than two files that differ. The windows-gnu sysroots are
      # the strongest of the lot: a produced archive that no longer hashes to what the compiler pins
      # means either the recipe moved or the published file is not what the recipe makes, and both of
      # those are somebody here finding out before a user does.
      - name: fail if one of ours failed
        if: >-
          needs.execute.result != 'success' || needs.real-libc.result != 'success'
          || needs.kernel-headers.result != 'success'
          || needs.kernel-headers-reproducible.result != 'success'
          || needs.glibc-headers.result != 'success'
          || needs.glibc-headers-reproducible.result != 'success'
          || needs.glibc-startfiles.result != 'success'
          || needs.glibc-startfiles-reproducible.result != 'success'
          || needs.glibc-distribution.result != 'success'
          || needs.glibc-versions.result != 'success'
          || needs.glibc-merged.result != 'success'
          || needs.glibc-merged-reproducible.result != 'success'
          || needs.glibc-image-check.result != 'success'
          || needs.mingw-sysroots.result != 'success'
        run: exit 1
      - name: pass
        run: echo "nightly is clean"
