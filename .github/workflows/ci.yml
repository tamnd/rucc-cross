# The per-commit gate. Everything here is required to merge.
#
# This repository exists so that the slow half of cross-compilation testing does not sit in the
# compiler's gate, which is the argument in README.md. That argument only works if this file
# stays fast too. Qemu, foreign sysroots, fetched SDKs and emulated hosts belong in nightly.yml,
# and the rule for deciding is the wall-clock one: a job that cannot finish inside the twenty
# minutes a reviewer will wait is a nightly job.
#
# Actions are pinned to a patch version rather than a major tag. A major tag is a moving
# reference, and a project that cannot reproduce its own CI run has given up something it needs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A force-push should cancel the run it replaced. The default branch is exempt, because a
# main-branch run is what the badge and the bisect history read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cheapest checks first, so a formatting mistake costs seconds rather than a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      # Same three prose rules as the compiler repository, so that a paragraph can move between
      # the two without being reformatted.
      - name: prose style
        run: cargo xtask style
      # spec/04-target-matrix.md section 4.7 says the published target table is generated from
      # the one the code reads. This is the check that keeps the two from drifting.
      - name: the target table is generated
        run: cargo xtask targets --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    # Runner images are named explicitly rather than through `-latest`, so that an image
    # rollout shows up as a commit rather than as yesterday's green run turning red. The policy
    # is the newest generally available image per host.
    #
    # The aarch64 Linux row is not here for coverage of the code, which is host independent. It
    # is here because spec/04-target-matrix.md section 4.4 says the host end of a cross compiler
    # is where nobody looks, and a second host architecture is the cheapest way to find out that
    # something reads the machine it is running on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64, debug
            os: ubuntu-24.04
            profile: dev
          - name: linux x86-64, release
            os: ubuntu-24.04
            profile: release
          - name: linux aarch64
            os: ubuntu-24.04-arm
            profile: dev
          - name: macos arm64
            os: macos-26
            profile: dev
          - name: windows x86-64
            os: windows-2025
            profile: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: cargo build
        run: cargo build --workspace --all-features --profile ${{ matrix.profile }}
      - name: cargo test
        run: cargo test --workspace --all-features --profile ${{ matrix.profile }}
      # The tier 4 promise from spec/04-target-matrix.md section 4.2 is that a target nothing is
      # emitted for still answers correctly, and the answer has to be the same on every host.
      # This is where a host-dependent default would show up.
      - name: the target queries answer the same on every host
        shell: bash
        run: |
          set -euo pipefail
          dir=${{ matrix.profile == 'dev' && 'debug' || 'release' }}
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cross="./target/$dir/rucc-cross$exe"
          "$cross" --version
          "$cross" targets
          "$cross" info aarch64-linux-musl
          test "$("$cross" canonical x86_64-unknown-linux-gnu)" = "x86_64-linux-gnu"
          test "$("$cross" canonical aarch64-apple-darwin23)" = "aarch64-macos.14"
          test "$("$cross" llvm-triple x86_64-windows-msvc)" = "x86_64-pc-windows-msvc"

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Every crate here is published so that the compiler can depend on it by version rather
      # than by path, so every crate's documentation has to build. A broken intra-doc link is a
      # broken link on docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: minimum supported rust version
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the floor from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
      # The toolchain file pins 1.98 so that a clippy release cannot turn a green run red
      # overnight, and the floor is a separate and lower number so that a tool people cannot
      # install on the machine where they need it does not become a tool they do not use. The
      # floor is raised deliberately, in a commit, not by accident in a dependency bump.
      - name: cargo check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  determinism:
    name: reproducible output
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # spec/02-the-goal.md claim 5 makes byte-identical output a requirement, and there is no
      # generated output to compare yet. Checking that the tool itself builds twice to the same
      # bytes is the same property one level down, and it catches the hash-order and timestamp
      # mistakes while they are still cheap to fix.
      - name: build twice and compare
        run: |
          set -euo pipefail
          cargo build --release --bin rucc-cross
          sha256sum target/release/rucc-cross > first.sha256
          rm -rf target/release/rucc-cross target/release/.fingerprint
          cargo build --release --bin rucc-cross
          sha256sum target/release/rucc-cross > second.sha256
          diff <(cut -d' ' -f1 first.sha256) <(cut -d' ' -f1 second.sha256)
          echo "the tool builds reproducibly"

  audit:
    name: supply chain
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny --all-features check
      # This repository will eventually download sysroots and unpack archives, which is exactly
      # the kind of work that arrives with a dependency tree. The count is printed on every
      # commit so that growth is something somebody decided rather than something that happened.
      - name: report the dependency count
        run: |
          set -euo pipefail
          count() {
            cargo tree "$@" --edges normal --prefix none --all-features \
              | sed 's/ (\*)$//' | sort -u | grep -c . || true
          }
          echo "the workspace: $(count --workspace) crates including transitives"
          echo "Everything outside the workspace is listed in the root Cargo.toml, and the list is currently empty."

  # A single required check, so branch protection does not have to list every job above.
  ci:
    name: ci
    if: always()
    needs: [quick, test, docs, msrv, determinism, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
