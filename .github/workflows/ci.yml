# The per-commit gate.
#
# Everything here runs against the pinned reference toolchain and nothing here builds rucc. That
# separation is the point of the repository: a change to the corpus or to the target table is
# checked against zig, gcc and qemu, and a change to the compiler is checked in the compiler's own
# repository, and neither one waits for the other.
#
# Actions are pinned to a patch version rather than a major tag. A major tag is a moving reference,
# and a project that cannot reproduce its own CI run has given up something it needs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Cheapest first, so a trailing tab costs seconds rather than a toolchain download.
  lint:
    name: house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: bin/lint
        run: ./bin/lint

  # The layout corpus for every one of the forty two targets, and the recorded facts for each of
  # them. Neither needs an emulator, so this is the job that says something about the whole table
  # rather than about the rows with a machine behind them.
  layout:
    name: layout and facts on ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    # Two hosts, because a cross compiler has two ends and the host end is where nobody looks. The
    # facts a target reports must not depend on the machine that asked, and this is where a
    # host-dependent answer would show up as a diff.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: macos arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cache the toolchains
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/rucc-cross
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/manifest') }}
      - name: install zig
        run: ./toolchains/install zig
      - name: the recorded facts still match the reference
        run: ./bin/facts --check
      - name: the layout corpus compiles for every target
        run: ./bin/compile-corpus

  # The compiler's two generated corpora, written by `cargo xtask abi-corpus` and
  # `cargo xtask abi-signatures` over there and compiled against the reference over here. They run
  # on every commit to this repository as well as on every commit to the compiler, because a change
  # to the pinned reference can break them just as a change to `layout_record` can, and the two
  # repositories would otherwise each assume the other was watching.
  #
  # It checks out the compiler at its default branch rather than at a pin. A pin here would turn a
  # real disagreement into a green build that is checking last month's numbers.
  abi-corpus:
    name: the compiler's generated corpora against the reference
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: cache the toolchains
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/rucc-cross
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/manifest') }}
      - name: install zig
        run: ./toolchains/install zig
      - name: compile it for every target it names
        run: ./bin/compile-abi-corpus rucc/tests/abi-corpus
      # The two halves of the signature corpus, for every row. Running it needs a back end and a
      # way to execute the result and that is the compiler repository's own job on one target. All
      # this says is that the corpus is C the reference accepts everywhere, which is what catches a
      # shape that is fine on x86-64 and a constraint violation on s390x on the day it is added.
      - name: compile the signature corpus for every target too
        run: ./bin/compile-abi-signatures rucc/tests/abi-signatures

  # The executing corpus, under qemu user mode for everything that is not this machine. Every line
  # of the output says whether it ran on hardware or under an emulator, because
  # spec/cross-compile/14-testing.md section 14.6 says a failure seen only under emulation leaves
  # the emulator a suspect and a result that does not say which cannot be read that way.
  execute:
    name: run the corpus under qemu
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the compiler out beside it
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: cache the toolchains
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/rucc-cross
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/manifest') }}
      - name: install zig and qemu
        run: |
          ./toolchains/install zig
          ./toolchains/install qemu
      - name: record which qemu this was
        run: qemu-x86_64 --version
      - name: build and run
        run: ./bin/run-corpus
      # The signature corpus, built with the reference on both sides and run on every architecture
      # that has a runner. It is the control build of the four in section 14.3 and not the
      # differential, because the other three need rucc to emit code for the target. Running the
      # control on its own is what characterizes each architecture's emulator, which is what
      # section 14.4's divergence list is made of, and it catches the corpus bugs that compiling
      # cannot see.
      - name: run the signature corpus under qemu too
        run: ./bin/run-abi-signatures rucc/tests/abi-signatures

  # A single required check, so branch protection does not have to list every job above.
  ci:
    name: ci
    if: always()
    needs: [lint, layout, abi-corpus, execute]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
