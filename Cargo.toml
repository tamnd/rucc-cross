[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rucc-cross"
homepage = "https://github.com/tamnd/rucc-cross"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["c", "compiler", "cross-compilation", "toolchain", "target"]
categories = ["compilers", "development-tools"]
readme = "README.md"

# One version for the whole workspace, bumped together, and internal crates pinned exactly so
# that a partial publish cannot produce a mixed version build. Same rule as the compiler
# repository, for the same reason.
[workspace.dependencies]
rucc-tuple = { version = "=0.1.0", path = "crates/rucc-tuple" }

# Dependencies outside the workspace go here rather than in the crate that wants one, so that
# the next one proposed has to be added to a list a reviewer reads. The list is empty on
# purpose. Nothing in this repository has needed a dependency yet, and the day one does is a
# day worth a paragraph in the pull request.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
